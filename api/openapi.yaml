openapi: 3.0.3
info:
  title: Multi-Tenant Healthcare API
  version: 0.1.0
  description: Shared-schema reference platform. See README for authorization and supported workflow outcomes.
servers:
  - url: http://127.0.0.1:18080
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      security: []
      responses:
        '200': {description: Alive}
  /readyz:
    get:
      security: []
      responses:
        '200': {description: Storage ready}
        '503': {description: Storage unavailable}
  /api/v1/me:
    get:
      responses:
        '200': {description: Current authorized tenant and membership}
  /api/v1/portal/overview:
    get:
      description: Tenant aggregate counts and daily series. Enforces collection roles and facility scopes and audits clinical reads. Dates use the tenant timezone.
      parameters:
        - name: days
          in: query
          schema: {type: integer, minimum: 1, maximum: 90, default: 7}
        - name: facility
          in: query
          schema: {type: string, description: Authorized facility ID or all}
      responses:
        '200':
          description: Counts, series, workflow statuses and generation time
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PortalOverview'}
        '403': {description: Facility scope denied}
  /api/v1/operations:
    get:
      description: Tenant administrator or auditor only. Process-wide Go runtime and worker measurements are explicitly shared, with tenant quotas and adapter capabilities. Unconfigured external systems have no fabricated metrics.
      responses:
        '200': {description: Runtime, workers, primary storage readiness, external adapter status and capabilities}
        '403': {description: Role denied}
  /api/v1/stream:
    get:
      description: Authenticated SSE invalidation hints with no clinical payload. Requires the bearer header. Membership and token validity are rechecked at each tick; clients refetch authorized collections.
      responses:
        '200':
          description: Refresh events at approximately 15 second intervals
          content:
            text/event-stream:
              schema: {type: string}
        '401': {description: Invalid or expired session}
  /api/v1/configuration:
    patch:
      description: Tenant administrators may lower current assigned quotas. Increases require the platform control plane. Uses version compare-and-swap and records a control audit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version, quotas]
              properties:
                version: {type: integer, minimum: 1}
                quotas: {$ref: '#/components/schemas/Quotas'}
      responses:
        '200': {description: Updated tenant including incremented version}
        '400': {description: Invalid budget or increase above current ceiling}
        '403': {description: Tenant administrator required}
        '409': {description: Stale tenant version}
  /api/v1/patients/{id}:
    parameters:
      - {$ref: '#/components/parameters/ID'}
    get:
      responses:
        '200': {description: Authorized patient; clinical read audited}
        '404': {description: Missing or unauthorized patient}
    patch:
      description: Update demographics and external reference within the existing facility. Facility transfers are not supported by this operation.
      parameters:
        - {$ref: '#/components/parameters/Idempotency'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [facility_id, external_id, name, birth_date]
              properties:
                facility_id: {type: string}
                external_id: {type: string, maxLength: 128}
                name: {type: string, maxLength: 200}
                birth_date: {type: string, format: date}
      responses:
        '200': {description: Updated patient; mutation audited and outbox event emitted}
        '400': {description: Invalid demographics or attempted facility transfer}
        '403': {description: Role or facility scope denied}
        '409': {description: Duplicate patient reference or changed idempotency input}
  /api/v1/appointments/{id}/cancel:
    parameters:
      - {$ref: '#/components/parameters/ID'}
      - {$ref: '#/components/parameters/Idempotency'}
    post:
      description: Atomically cancel a confirmed appointment, release reservations and return its workflow to ready_to_schedule. Denied after administration is recorded.
      responses:
        '200': {description: Cancelled appointment; mutation audited and outbox event emitted}
        '403': {description: Role or facility scope denied}
        '409': {description: Appointment or workflow is no longer cancellable}
  /metrics:
    get:
      security: []
      responses:
        '200': {description: Prometheus aggregate metrics}
  /api/v1/memberships/{user}:
    parameters:
      - name: user
        in: path
        required: true
        schema: {type: string, maxLength: 200}
    put:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roles, facilities, active]
              additionalProperties: false
              properties:
                roles:
                  type: array
                  items: {type: string, enum: [tenant_admin, clinical, billing, auditor, integration]}
                facilities:
                  type: array
                  items: {type: string, description: Facility ID or '*' for all tenant facilities}
                active: {type: boolean}
      responses:
        '200': {description: Tenant membership updated; tenant administrator only}
  /api/v1/staff:
    get:
      responses:
        '200': {description: Authorized staff page}
    post:
      parameters:
        - {$ref: '#/components/parameters/Idempotency'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [facility_id, name, qualifications]
              additionalProperties: false
              properties:
                facility_id: {type: string}
                name: {type: string}
                qualifications: {type: array, items: {type: string}, example: [infusion]}
      responses:
        '201': {description: Active staff record created}
  /api/v1/care-resources:
    get:
      responses:
        '200': {description: Authorized resource page}
    post:
      parameters:
        - {$ref: '#/components/parameters/Idempotency'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [facility_id, name, kind]
              additionalProperties: false
              properties:
                facility_id: {type: string}
                name: {type: string}
                kind: {type: string, enum: [chair, room]}
      responses:
        '201': {description: Care resource created}
  /api/v1/{collection}:
    parameters:
      - {$ref: '#/components/parameters/Collection'}
    get:
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
        - name: after
          in: query
          schema: {type: string}
      responses:
        '200': {description: Authorized collection page with items and optional next_cursor}
  /api/v1/{collection}/{id}:
    parameters:
      - {$ref: '#/components/parameters/Collection'}
      - {$ref: '#/components/parameters/ID'}
    get:
      responses:
        '200': {description: Authorized resource}
        '404': {description: Missing or unauthorized resource}
  /api/v1/schedules/{id}/actions:
    parameters:
      - {$ref: '#/components/parameters/ID'}
      - {$ref: '#/components/parameters/Idempotency'}
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              additionalProperties: false
              properties:
                action: {type: string, enum: [pause, resume, trigger]}
      responses:
        '200': {description: Schedule action recorded}
  /api/v1/jobs/{id}/actions:
    parameters:
      - {$ref: '#/components/parameters/ID'}
      - {$ref: '#/components/parameters/Idempotency'}
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              additionalProperties: false
              properties:
                action: {type: string, enum: [cancel, retry]}
      responses:
        '200': {description: Job action recorded}
  /fhir/Patient:
    get:
      responses:
        '200': {description: FHIR search Bundle subset using limit and after query parameters}
  /api/v1/platform/tenants:
    get:
      responses:
        '200': {description: Paginated registry, platform operator only}
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, name, admin_user_id, region]
              additionalProperties: false
              properties:
                id: {type: string, pattern: '^[a-zA-Z0-9_-]{1,64}$'}
                name: {type: string}
                admin_user_id: {type: string}
                timezone: {type: string, default: UTC}
                region: {type: string}
                quotas: {$ref: '#/components/schemas/Quotas'}
      responses:
        '201': {description: Tenant and administrator provisioned}
        '200': {description: Matching provision request already exists}
  /api/v1/platform/tenants/{id}:
    parameters:
      - {$ref: '#/components/parameters/ID'}
    get:
      responses:
        '200': {description: Tenant metadata}
    patch:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              additionalProperties: false
              properties:
                version: {type: integer, minimum: 1}
                status: {type: string, enum: [active, suspended, offboarding, archived]}
                quotas: {$ref: '#/components/schemas/Quotas'}
      responses:
        '200': {description: Updated versioned tenant}
        '409': {description: Stale version}
  /api/v1/facilities:
    get:
      responses:
        '200': {description: Authorized facility page}
    post:
      parameters:
        - {$ref: '#/components/parameters/Idempotency'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, capacity]
              additionalProperties: false
              properties:
                name: {type: string}
                capacity: {type: integer, minimum: 1, maximum: 1000}
      responses:
        '201': {description: Facility created or original idempotent result}
  /api/v1/patients:
    get:
      responses:
        '200': {description: Authorized patient page; limit and after query parameters}
    post:
      parameters:
        - {$ref: '#/components/parameters/Idempotency'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [facility_id, external_id, name, birth_date]
              additionalProperties: false
              properties:
                facility_id: {type: string}
                external_id: {type: string}
                name: {type: string}
                birth_date: {type: string, format: date}
      responses:
        '201': {description: Patient created}
        '409': {description: Duplicate external identity or conflicting idempotency key}
  /api/v1/orders:
    get:
      responses:
        '200': {description: Authorized order page}
    post:
      parameters:
        - {$ref: '#/components/parameters/Idempotency'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [patient_id, medication, prescription]
              additionalProperties: false
              properties:
                patient_id: {type: string}
                medication: {type: string}
                prescription: {type: string, description: Approved prescription reference; not an automated clinical validation}
      responses:
        '201': {description: Order, workflow, job, audit and outbox committed}
        '429': {description: Tenant queue quota exhausted; entire mutation rolled back}
  /api/v1/workflows/{id}/outcomes:
    parameters:
      - {$ref: '#/components/parameters/ID'}
      - {$ref: '#/components/parameters/Idempotency'}
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [step, outcome]
              additionalProperties: false
              properties:
                step: {type: string, enum: [insurance, inventory, clearance, administration, billing]}
                outcome: {type: string, enum: [approved, rejected, available, unavailable, completed, submitted]}
      responses:
        '200': {description: Outcome and advance job recorded; worker applies transition}
        '409': {description: Invalid state or conflicting previously recorded outcome}
  /api/v1/workflows/{id}/cancel:
    parameters:
      - {$ref: '#/components/parameters/ID'}
      - {$ref: '#/components/parameters/Idempotency'}
    post:
      responses:
        '200': {description: Workflow cancelled and appointment reservations compensated}
  /api/v1/appointments:
    get:
      responses:
        '200': {description: Authorized appointment page}
    post:
      parameters:
        - {$ref: '#/components/parameters/Idempotency'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_id, nurse_id, resource_id, starts_at, ends_at]
              additionalProperties: false
              properties:
                order_id: {type: string}
                nurse_id: {type: string}
                resource_id: {type: string}
                starts_at: {type: string, format: date-time}
                ends_at: {type: string, format: date-time}
      responses:
        '201': {description: Appointment confirmed and workflow marked scheduled}
        '409': {description: Eligibility, capacity or scheduling conflict}
  /api/v1/schedules:
    get:
      responses:
        '200': {description: Schedule page; tenant administrator or auditor}
    post:
      parameters:
        - {$ref: '#/components/parameters/Idempotency'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, expression]
              additionalProperties: false
              properties:
                kind: {type: string, enum: [reconciliation]}
                expression: {type: string, example: '@every 15m'}
      responses:
        '201': {description: Tenant-timezone schedule created}
  /fhir/Patient/{id}:
    parameters:
      - {$ref: '#/components/parameters/ID'}
    get:
      responses:
        '200': {description: FHIR Patient representation subset}
        '404': {description: Missing or unauthorized patient}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Collection:
      name: collection
      in: path
      required: true
      schema:
        type: string
        enum: [facilities, staff, care-resources, patients, orders, workflows, appointments, jobs, schedules, audit, events]
    ID:
      name: id
      in: path
      required: true
      schema: {type: string}
    Idempotency:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 128}
  schemas:
    PortalOverview:
      type: object
      required: [counts, series, statuses, generated_at, days]
      properties:
        counts:
          type: object
          additionalProperties: {type: integer}
          description: Only counts for collections the current role may read
        series:
          type: array
          items:
            type: object
            properties:
              date: {type: string, format: date}
              orders: {type: integer}
              completed: {type: integer}
        statuses:
          type: array
          items:
            type: object
            properties:
              name: {type: string}
              count: {type: integer}
        generated_at: {type: string, format: date-time}
        days: {type: integer}
    Quotas:
      type: object
      required: [concurrent_jobs, queued_jobs, memory_mb, requests_per_minute]
      additionalProperties: false
      properties:
        concurrent_jobs: {type: integer, minimum: 1, maximum: 64}
        queued_jobs: {type: integer, minimum: 1, maximum: 10000}
        memory_mb: {type: integer, minimum: 8, maximum: 4096}
        requests_per_minute: {type: integer, minimum: 1, maximum: 100000}
