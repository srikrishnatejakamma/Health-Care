# Apply api.yaml first. Publish the portal image to your registry before deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: careflow-portal
  namespace: healthcare
spec:
  replicas: 2
  selector:
    matchLabels: {app: careflow-portal}
  template:
    metadata:
      labels: {app: careflow-portal}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: portal
          image: careflow-portal:local
          ports:
            - {name: http, containerPort: 8080}
          env:
            - {name: API_UPSTREAM, value: 'healthcare-api:80'}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 500m, memory: 128Mi}
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 5
            periodSeconds: 15
          volumeMounts:
            - {name: temporary, mountPath: /tmp}
            - {name: rendered-config, mountPath: /etc/nginx/conf.d}
      volumes:
        - name: temporary
          emptyDir: {sizeLimit: 16Mi}
        - name: rendered-config
          emptyDir: {sizeLimit: 1Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: careflow-portal
  namespace: healthcare
spec:
  selector: {app: careflow-portal}
  ports:
    - {name: http, port: 80, targetPort: http}
