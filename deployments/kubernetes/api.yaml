apiVersion: v1
kind: Namespace
metadata:
  name: healthcare
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: healthcare-api
  namespace: healthcare
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthcare-api
  namespace: healthcare
spec:
  replicas: 2
  selector:
    matchLabels:
      app: healthcare-api
  template:
    metadata:
      labels:
        app: healthcare-api
    spec:
      serviceAccountName: healthcare-api
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: healthcare-framework:local
          ports:
            - name: http
              containerPort: 8080
          env:
            - {name: APP_ENV, value: production}
            - {name: STORE, value: postgres}
            - {name: HTTP_ADDR, value: "0.0.0.0:8080"}
            - {name: TLS_TERMINATED_AT_PROXY, value: "true"}
            - {name: DEMO_SEED, value: "false"}
            - {name: WORKER_ENABLED, value: "true"}
            - {name: GOMEMLIMIT, value: 192MiB}
            - {name: MEMORY_BUDGET_MB, value: "128"}
            - name: AUTH_KEY
              valueFrom:
                secretKeyRef: {name: healthcare-runtime, key: auth-key}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: healthcare-runtime, key: database-url}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: healthcare-api
  namespace: healthcare
spec:
  selector: {app: healthcare-api}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: healthcare-api
  namespace: healthcare
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: healthcare-api}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: healthcare-api
  namespace: healthcare
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: healthcare-api}
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
